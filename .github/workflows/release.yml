name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Desktop Application
        uses: tauri-apps/action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DJDeX ${{ github.ref_name }}'
          releaseBody: |
            ### DJDeX By Kangpcode - Release ${{ github.ref_name }}
            
            Silakan unduh paket installer sesuai sistem operasi Anda:
            - **Windows**: `.msi` (Windows Installer) atau `.exe` (NSIS Setup)
            - **macOS**: `.dmg` (Universal Binary - Apple Silicon & Intel)
            - **Linux**: `.deb` (Debian/Ubuntu) atau `.AppImage` (Universal Linux)
            
            Lihat [CHANGELOG.md](CHANGELOG.md) untuk daftar lengkap perubahan.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
